
<!-- WA cabang: semua klik WhatsApp ke nomor pusat di halaman ini dialihkan ke nomor kantor cabang (__NAMA__).
     Termasuk tombol melayang Click to Chat (rotasi nomor dimatikan untuk halaman ini). Tracking GA/Pixel plugin tetap jalan. -->
<script data-no-optimize="1" data-no-defer="1" data-cfasync="false">
(function(){
  var NO='__NO__', PUSAT='6281287292422';
  var re=new RegExp('((?:phone=|wa\\.me/)(?:%2B|\\+)?)'+PUSAT,'g');
  function fixLinks(root){
    (root||document).querySelectorAll('a[href*="'+PUSAT+'"]').forEach(function(a){
      if(/whatsapp\.com|wa\.me/.test(a.href)) a.href=a.href.replace(re,'$1'+NO);
    });
  }
  function fixCtc(){
    var v=window.ht_ctc_chat_var;
    if(v){v.number=NO;v.r_nums=[NO];delete v.r_sqx;}
    var d=document.querySelector('.ht_ctc_chat_data');
    if(d){try{var s=JSON.parse(d.getAttribute('data-settings')||'{}');s.number=NO;s.r_nums=[NO];delete s.r_sqx;d.setAttribute('data-settings',JSON.stringify(s));}catch(e){}}
  }
  // Fase capture: jalan sebelum handler plugin, jadi nomor sudah benar saat link dibuka.
  document.addEventListener('click',function(e){
    fixCtc();
    var a=e.target.closest&&e.target.closest('a[href]');
    if(a&&a.href.indexOf(PUSAT)>-1&&/whatsapp\.com|wa\.me/.test(a.href)) a.href=a.href.replace(re,'$1'+NO);
  },true);
  function run(){fixLinks();fixCtc();}
  if(document.readyState==='loading') document.addEventListener('DOMContentLoaded',run); else run();
  window.addEventListener('load',run);
})();
</script>
