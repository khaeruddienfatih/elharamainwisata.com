<!-- Section Harga Paket Umroh — gaya kartu paket (referensi: jejakimani.com/umroh).
     Tempel ke widget HTML Elementor. Gambar dari Cloudinary folder Elharamainwisata/Header.
     Ubah data paket cukup di array PAKET pada <script> di bawah.
     price: angka rupiah (mis. 37000000) atau null → tampil "Hubungi Kami".
     warna label: 'merah' atau 'biru'. Kartu mengarah ke `detail` bila diisi, selain itu ke WhatsApp. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Literata:wght@600&display=swap" rel="stylesheet">
<style>
.ehpk{--ink:#1d2433;--muted:#5b6474;--line:#e6e8ee;--merah:linear-gradient(90deg,#8e1b1b,#c0504d);--biru:linear-gradient(90deg,#1f3553,#5b7494);font-family:Mulish,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);line-height:1.5;max-width:1000px;margin:0 auto;padding:48px 16px}
.ehpk *{box-sizing:border-box}
.ehpk .hd{margin-bottom:36px}
.ehpk .hd h2{font-family:Literata,Georgia,serif;font-weight:600;font-size:clamp(28px,4.5vw,40px);line-height:1.15;margin:0 0 8px;color:var(--ink)}
.ehpk .hd p{margin:0;color:var(--muted);font-size:17px}
.ehpk .grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:32px;align-items:start}
.ehpk .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:box-shadow .2s,transform .2s}
.ehpk .card:hover{box-shadow:0 12px 28px rgba(29,36,51,.12);transform:translateY(-3px)}
.ehpk .img{aspect-ratio:7/5;background:#eef1f6}
.ehpk .img img{width:100%;height:100%;object-fit:cover;display:block}
.ehpk .body{padding:16px 16px 18px}
.ehpk .tag{display:inline-block;color:#fff;font-weight:800;font-size:14px;padding:3px 26px 3px 12px;border-radius:4px 999px 999px 4px;background:var(--biru)}
.ehpk .tag.merah{background:var(--merah)}
.ehpk .desc{margin:14px 0 16px;font-size:14px;color:var(--muted)}
.ehpk .rows{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.ehpk .rows li{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ehpk .rows .k{display:flex;align-items:center;gap:8px;flex:none}
.ehpk .rows svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ehpk .rows .v{text-align:right}
.ehpk .foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:28px}
.ehpk .foot small{font-size:12px;color:var(--muted)}
.ehpk .foot b{font-size:16px;font-weight:800;color:var(--ink)}
@media (max-width:640px){.ehpk{padding:36px 16px}.ehpk .grid{gap:20px}}
</style>

<div class="ehpk" id="paket-umroh">
  <div class="hd">
    <h2>Umroh Lebih Nyaman</h2>
    <p>Pilih jadwal keberangkatan yang paling pas untuk ibadah Anda.</p>
  </div>
  <div class="grid"></div>
</div>

<script>
(function(){
  var WA = '6281287292422';
  var IMG = 'https://res.cloudinary.com/v6gwkqrb/image/upload/c_fill,g_auto,w_700,h_500,q_auto,f_auto/';

  // Gambar = public_id di folder Cloudinary Elharamainwisata/Header (1–21, 28–31).
  // TODO: lengkapi harga/hotel/durasi paket yang masih null sebelum publish.
  var PAKET = [
    {img:'1',  label:'Premium Riyadh Air', warna:'merah', desc:'Umroh musim sejuk 10 hari, berangkat 26 November 2026.', hari:10, maskapai:'Riyadh Air', hotel:'Bintang 5', price:37000000, detail:''},
    {img:'5',  label:'Musim Dingin',       warna:'biru',  desc:'Umroh musim dingin bulan Desember.', hari:9, maskapai:'Saudia Airlines', hotel:null, price:null, detail:''},
    {img:'9',  label:'Liburan Akhir Tahun',warna:'biru',  desc:'Umroh bersama keluarga di liburan akhir tahun.', hari:null, maskapai:'Saudia Airlines', hotel:null, price:null, detail:''},
    {img:'13', label:'Januari 9 Hari',     warna:'biru',  desc:'Umroh musim dingin Januari 2027.', hari:9, maskapai:'Saudia Airlines', hotel:null, price:null, detail:''},
    {img:'17', label:'Januari 12 Hari',    warna:'merah', desc:'Umroh 12 hari Januari 2027.', hari:12, maskapai:null, hotel:null, price:null, detail:''}
  ];

  var IC = {
    durasi:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    maskapai:'<svg viewBox="0 0 24 24"><path d="M10.5 3.5 13 10h5.5a2 2 0 0 1 0 4H13l-2.5 6.5H8.5L10 14H6l-1.5 2H3l1-4-1-4h1.5L6 10h4L8.5 3.5z"/></svg>',
    hotel:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-4h4v4"/></svg>'
  };
  var grid = document.querySelector('#paket-umroh .grid');

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function row(k, label, v){return '<li><span class="k">' + IC[k] + label + '</span><span class="v">' + esc(v) + '</span></li>';}
  function link(p){
    if (p.detail) return esc(p.detail) + '"';
    return 'https://api.whatsapp.com/send?phone=' + WA + '&amp;text=' + encodeURIComponent('Assalamualaikum, saya mau info paket umroh ' + p.label) + '" target="_blank" rel="noopener"';
  }

  grid.innerHTML = PAKET.map(function(p){
    return '<a class="card" href="' + link(p) + '>' +
      '<div class="img"><img loading="lazy" src="' + IMG + esc(p.img) + '.jpg" alt="Paket umroh ' + esc(p.label) + '"></div>' +
      '<div class="body">' +
        '<span class="tag ' + esc(p.warna) + '">' + esc(p.label) + '</span>' +
        '<p class="desc">' + esc(p.desc) + '</p>' +
        '<ul class="rows">' +
          row('durasi', 'Durasi', p.hari ? 'Mulai dari ' + p.hari + ' hari' : 'Hubungi kami') +
          row('maskapai', 'Maskapai', p.maskapai || 'Hubungi kami') +
          row('hotel', 'Hotel', p.hotel || 'Hubungi kami') +
        '</ul>' +
        '<div class="foot"><small>' + (p.price ? 'Mulai dari' : 'Harga') + '</small><b>' + (p.price ? 'Rp ' + p.price.toLocaleString('id-ID') : 'Hubungi Kami') + '</b></div>' +
      '</div></a>';
  }).join('');
})();
</script>
