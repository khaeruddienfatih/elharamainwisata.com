<!-- Section Harga Paket Umroh — gaya kartu paket (referensi: jejakimani.com/umroh).
     Tempel ke widget HTML Elementor. Gambar dari Cloudinary folder Elharamainwisata/Header.
     Ubah data paket cukup di array PAKET pada <script> di bawah.
     Sumber harga: brosur PDF (lihat data/harga-paket-umroh.md). Harga per jamaah: quad/triple/double.
     warna label mengikuti tier: bronze, silver, gold, platinum, premium.
     Kartu mengarah ke `detail` bila diisi, selain itu ke WhatsApp.
     Tab "Semua" menampilkan 3–6 kartu (baris penuh 3 kolom): paket bertanda unggulan:true (maks 6),
     sisa slot diisi kartu "Paket Lainnya" (konsultasi WhatsApp). Tab bulan: semua paketnya + 1 kartu konsultasi. -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Mulish:wght@400;600;700;800&family=Literata:wght@600&display=swap" rel="stylesheet">
<style>
.ehpk{--ink:#1d2433;--muted:#5b6474;--line:#e6e8ee;--navy:#1f3553;--merah:linear-gradient(90deg,#8e1b1b,#c0504d);--biru:linear-gradient(90deg,#1f3553,#5b7494);font-family:Mulish,system-ui,-apple-system,Segoe UI,Roboto,sans-serif;color:var(--ink);line-height:1.5;max-width:1000px;margin:0 auto;padding:48px 16px}
.ehpk *{box-sizing:border-box}
.ehpk .hd{margin-bottom:24px}
.ehpk .hd h2{font-family:Literata,Georgia,serif;font-weight:600;font-size:clamp(28px,4.5vw,40px);line-height:1.15;margin:0 0 8px;color:var(--ink)}
.ehpk .hd p{margin:0;color:var(--muted);font-size:17px}
.ehpk .tabs{display:flex;gap:8px;flex-wrap:wrap;margin:0 0 28px}
.ehpk .tab{border:1px solid var(--line);background:#fff;color:var(--muted);border-radius:999px;padding:8px 18px;font:700 14px/1 inherit;font-family:inherit;cursor:pointer;transition:.2s}
.ehpk .tab:hover{border-color:var(--navy);color:var(--navy)}
.ehpk .tab.on{background:var(--navy);border-color:var(--navy);color:#fff}
.ehpk .grid{--gap:32px;--col:3;display:flex;flex-wrap:wrap;justify-content:center;gap:var(--gap)}
.ehpk .grid>.card{width:calc((100% - (var(--col) - 1) * var(--gap)) / var(--col))}
.ehpk .card{display:flex;flex-direction:column;background:#fff;border:1px solid var(--line);border-radius:14px;overflow:hidden;text-decoration:none;color:inherit;transition:box-shadow .2s,transform .2s}
.ehpk .card:hover{box-shadow:0 12px 28px rgba(29,36,51,.12);transform:translateY(-3px)}
.ehpk .img{aspect-ratio:7/5;background:#eef1f6}
.ehpk .img img{width:100%;height:100%;object-fit:cover;display:block}
.ehpk .body{padding:16px 16px 18px;display:flex;flex-direction:column;flex:1}
.ehpk .tag{align-self:flex-start;color:#fff;font-weight:800;font-size:14px;padding:3px 26px 3px 12px;border-radius:4px 999px 999px 4px;background:var(--biru)}
.ehpk .tag.bronze{background:linear-gradient(90deg,#7a4a22,#b98150)}
.ehpk .tag.silver{background:linear-gradient(90deg,#4f5d70,#95a3b5)}
.ehpk .tag.gold{background:linear-gradient(90deg,#8c6812,#d0a534)}
.ehpk .tag.platinum{background:var(--biru)}
.ehpk .tag.premium{background:var(--merah)}
.ehpk .desc{margin:14px 0 16px;font-size:14px;color:var(--muted)}
.ehpk .rows{margin:0;padding:0;list-style:none;display:grid;gap:8px;font-size:14px;color:var(--muted)}
.ehpk .rows li{display:flex;justify-content:space-between;align-items:center;gap:12px}
.ehpk .rows .k{display:flex;align-items:center;gap:8px;flex:none}
.ehpk .rows svg{width:16px;height:16px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.ehpk .rows .v{text-align:right}
.ehpk .foot{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-top:auto;padding-top:28px}
.ehpk .foot small{font-size:12px;color:var(--muted)}
.ehpk .foot b{font-size:16px;font-weight:800;color:var(--ink)}
.ehpk .kamar{margin:6px 0 0;font-size:12px;color:var(--muted);text-align:right}
.ehpk .more{justify-content:center;align-items:center;text-align:center;padding:32px 24px;background:linear-gradient(160deg,#1f3553,#3b5578);color:#fff;border:0}
.ehpk .more .ic{width:56px;height:56px;border-radius:50%;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:0 auto 16px}
.ehpk .more .ic svg{width:26px;height:26px;fill:#fff}
.ehpk .more h3{font-family:Literata,Georgia,serif;font-weight:600;font-size:22px;margin:0 0 8px}
.ehpk .more p{margin:0 0 20px;font-size:14px;opacity:.85}
.ehpk .more span{display:inline-block;background:#fff;color:var(--navy);font-weight:800;font-size:14px;padding:10px 20px;border-radius:999px}
@media (max-width:900px){.ehpk .grid{--col:2;--gap:20px}}
@media (max-width:600px){.ehpk{padding:36px 16px}.ehpk .grid{--col:1}.ehpk .tabs{flex-wrap:nowrap;overflow-x:auto;padding-bottom:4px}.ehpk .tab{flex:none}}
</style>

<div class="ehpk" id="paket-umroh">
  <div class="hd">
    <h2>Umroh Lebih Nyaman</h2>
    <p>Pilih jadwal keberangkatan yang paling pas untuk ibadah Anda.</p>
  </div>
  <div class="tabs" role="tablist"></div>
  <div class="grid"></div>
</div>

<script>
(function(){
  var WA = '6281287292422';
  var IMG = 'https://res.cloudinary.com/v6gwkqrb/image/upload/c_fill,g_auto,w_700,h_500,q_auto,f_auto/';
  var MIN = 3, MAX = 6, KOLOM = 3;

  // Gambar = public_id di folder Cloudinary Elharamainwisata/Header (1–21, 28–31).
  // Harga dari brosur (update brosur: Riyadh Air 22/09/2026, Awal Des 18/08/2026, Akhir Des 23/09/2026, Jan 10/09/2026).
  // q/t/d = harga per jamaah sekamar ber-empat / ber-tiga / ber-dua. Hotel: Makkah / Madinah (atau setaraf).
  var PAKET = [
    // November 2026 — Musim Sejuk 10 hari
    {img:'1',  bulan:'November', label:'Bronze', tier:'bronze', unggulan:true, desc:'Musim Sejuk by Riyadh Air: Thaif + kereta cepat + city tour Jeddah.', hari:10, maskapai:'Riyadh Air', makkah:'Prestige / Anjum', madinah:'Peninsula / Al-Aqeeq', berangkat:'26 Nov 2026', q:37000000, t:40000000, d:43000000},
    // Awal–Tengah Desember 2026 — Musim Dingin 9/12 hari, Saudia
    {img:'2',  bulan:'Desember', label:'Bronze', tier:'bronze', unggulan:true, desc:'Musim Dingin, in Jeddah – out Jeddah. Thaif + kereta cepat.', hari:9, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Peninsula Worth', berangkat:'8 Des 2026', q:36500000, t:38500000, d:40500000},
    {img:'3',  bulan:'Desember', label:'Bronze Plus', tier:'bronze', desc:'Musim Dingin, in Jeddah – out Jeddah. Jumat di Masjidil Haram.', hari:9, maskapai:'Saudia Airlines', makkah:'Prestige', madinah:'Peninsula Worth', berangkat:'11 & 12 Des 2026', q:37500000, t:39500000, d:41500000},
    {img:'4',  bulan:'Desember', label:'Silver · Makkah First', tier:'silver', desc:'Musim Dingin, in Jeddah – out Madinah. Thaif + kereta cepat.', hari:9, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Peninsula Worth', berangkat:'8 Des 2026', q:37500000, t:39500000, d:41500000},
    {img:'5',  bulan:'Desember', label:'Silver · Madinah First', tier:'silver', desc:'Musim Dingin, in Madinah – out Jeddah. Thaif + kereta cepat.', hari:9, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Al-Aqeeq', berangkat:'1 & 7 Des 2026', q:38000000, t:40000000, d:42000000},
    {img:'6',  bulan:'Desember', label:'Silver 12 Hari', tier:'silver', desc:'Madinah First, in Madinah – out Jeddah. Free GMC tour night Jabal Uhud.', hari:12, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Peninsula Worth', berangkat:'9 Des 2026', q:41500000, t:43500000, d:46500000},
    {img:'7',  bulan:'Desember', label:'Platinum', tier:'platinum', unggulan:true, desc:'In Madinah – out Jeddah. Free hotel H-1, abaya & jaket, GMC tour Jabal Uhud.', hari:9, maskapai:'Saudia Airlines', makkah:'Marwa Rotana / Movenpick', madinah:'Al-Aqeeq / Al-Haram', berangkat:'7 Des 2026', q:46500000, t:48500000, d:51500000},
    // Akhir Desember 2026 — Eksklusif 9/12 hari, Saudia JED-JED, 2x kereta cepat
    {img:'8',  bulan:'Desember', label:'Eksklusif Silver', tier:'silver', unggulan:true, desc:'Liburan akhir tahun: Thaif + 2x kereta cepat + GMC tour Jabal Uhud.', hari:9, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Al-Aqeeq', berangkat:'21, 22 & 26 Des 2026', q:47000000, t:51000000, d:56000000},
    {img:'9',  bulan:'Desember', label:'Eksklusif Platinum', tier:'platinum', desc:'Liburan akhir tahun. Free hotel H-1, outer & jaket, wahana Toboggan.', hari:9, maskapai:'Saudia Airlines', makkah:'Marwa Rotana / Movenpick', madinah:'Al-Aqeeq / Al-Haram', berangkat:'21, 22 & 26 Des 2026', q:54000000, t:58000000, d:64000000},
    {img:'10', bulan:'Desember', label:'Eksklusif Silver 12 Hari', tier:'silver', desc:'Liburan akhir tahun 12 hari: Thaif + 2x kereta cepat.', hari:12, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Al-Aqeeq', berangkat:'27 Des 2026', q:53000000, t:57000000, d:66000000},
    {img:'11', bulan:'Desember', label:'Eksklusif Gold 12 Hari', tier:'gold', desc:'Liburan akhir tahun 12 hari: Thaif + 2x kereta cepat + GMC tour.', hari:12, maskapai:'Saudia Airlines', makkah:'Marwa Rotana / Movenpick', madinah:'Al-Aqeeq', berangkat:'23 & 27 Des 2026', q:60000000, t:66000000, d:75000000},
    // Januari 2027 — High Season Musim Dingin 9/12 hari, Saudia
    {img:'12', bulan:'Januari', label:'Bronze', tier:'bronze', unggulan:true, desc:'High season musim dingin, in Jeddah – out Jeddah. Thaif + kereta cepat.', hari:9, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Al-Aqeeq', berangkat:'3, 4, 9, 11, 17 & 31 Jan 2027', q:37900000, t:40400000, d:43900000},
    {img:'13', bulan:'Januari', label:'Silver', tier:'silver', desc:'High season musim dingin. Med–Jed (3, 4, 31 Jan) atau Jed–Med (25 Jan).', hari:9, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Al-Aqeeq', berangkat:'3, 4, 25 & 31 Jan 2027', q:39000000, t:41500000, d:45000000},
    {img:'14', bulan:'Januari', label:'Platinum', tier:'platinum', desc:'In Madinah – out Jeddah. Free hotel H-1, Jabal Khandama, abaya & jaket.', hari:9, maskapai:'Saudia Airlines', makkah:'Marwa Rotana / Movenpick', madinah:'Movenpick', berangkat:'11, 18, 25 & 31 Jan 2027', q:48500000, t:51500000, d:55500000},
    {img:'15', bulan:'Januari', label:'Premium', tier:'premium', desc:'In Madinah – out Jeddah. Free hotel H-1, Jabal Khandama, GMC tour Jabal Uhud.', hari:9, maskapai:'Saudia Airlines', makkah:'Fairmont', madinah:'Movenpick', berangkat:'11 & 31 Jan 2027', q:52000000, t:56000000, d:61000000},
    {img:'16', bulan:'Januari', label:'Silver 12 Hari', tier:'silver', desc:'In Madinah – out Jeddah. Free GMC tour night Jabal Uhud.', hari:12, maskapai:'Saudia Airlines', makkah:'Anjum', madinah:'Al-Aqeeq', berangkat:'13, 14 & 20 Jan 2027', q:43500000, t:46000000, d:49500000},
    {img:'17', bulan:'Januari', label:'Gold 12 Hari', tier:'gold', unggulan:true, desc:'In Madinah – out Jeddah. Free GMC tour night Jabal Uhud.', hari:12, maskapai:'Saudia Airlines', makkah:'Marwa Rotana / Movenpick', madinah:'Al-Aqeeq', berangkat:'14, 20 & 24 Jan 2027', q:54000000, t:57000000, d:61000000}
  ];

  var IC = {
    durasi:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
    maskapai:'<svg viewBox="0 0 24 24"><path d="M10.5 3.5 13 10h5.5a2 2 0 0 1 0 4H13l-2.5 6.5H8.5L10 14H6l-1.5 2H3l1-4-1-4h1.5L6 10h4L8.5 3.5z"/></svg>',
    tanggal:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    hotel:'<svg viewBox="0 0 24 24"><rect x="4" y="3" width="16" height="18" rx="1"/><path d="M8 7h2M14 7h2M8 11h2M14 11h2M10 21v-4h4v4"/></svg>',
    wa:'<svg viewBox="0 0 24 24"><path d="M12 2a10 10 0 0 0-8.6 15.1L2 22l5-1.3A10 10 0 1 0 12 2zm0 18.2c-1.5 0-3-.4-4.3-1.2l-.3-.2-3 .8.8-2.9-.2-.3A8.2 8.2 0 1 1 12 20.2zm4.5-6.1c-.2-.1-1.5-.7-1.7-.8s-.4-.1-.6.1-.7.8-.8 1-.3.2-.5.1a6.7 6.7 0 0 1-3.3-2.9c-.3-.4.2-.4.7-1.4.1-.2 0-.3 0-.5l-.8-1.8c-.2-.5-.4-.4-.6-.4h-.5a1 1 0 0 0-.7.3 3 3 0 0 0-.9 2.2 5.2 5.2 0 0 0 1.1 2.7 11.8 11.8 0 0 0 4.5 4c1.7.7 2.3.8 3.2.6a2.7 2.7 0 0 0 1.8-1.3 2.2 2.2 0 0 0 .1-1.3c0-.1-.2-.2-.4-.3z"/></svg>'
  };
  var root = document.getElementById('paket-umroh');
  var tabs = root.querySelector('.tabs'), grid = root.querySelector('.grid');

  function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  function waUrl(teks){return 'https://api.whatsapp.com/send?phone=' + WA + '&amp;text=' + encodeURIComponent(teks);}
  function jt(n){return 'Rp ' + (n / 1e6).toLocaleString('id-ID') + ' jt';}
  function row(k, label, v){return '<li><span class="k">' + IC[k] + label + '</span><span class="v">' + esc(v) + '</span></li>';}

  function card(p){
    var href = p.detail ? esc(p.detail) + '"' : waUrl('Assalamualaikum, saya mau info paket umroh ' + p.label + ' ' + p.hari + ' hari, keberangkatan ' + p.berangkat) + '" target="_blank" rel="noopener"';
    return '<a class="card" href="' + href + '>' +
      '<div class="img"><img loading="lazy" src="' + IMG + esc(p.img) + '.jpg" alt="Paket umroh ' + esc(p.label) + ' ' + esc(p.bulan) + '"></div>' +
      '<div class="body">' +
        '<span class="tag ' + esc(p.tier) + '">' + esc(p.label) + '</span>' +
        '<p class="desc">' + esc(p.desc) + '</p>' +
        '<ul class="rows">' +
          row('durasi', 'Durasi', p.hari + ' hari') +
          row('maskapai', 'Maskapai', p.maskapai) +
          row('hotel', 'Hotel Makkah', p.makkah + ' ★5') +
          row('tanggal', 'Berangkat', p.berangkat) +
        '</ul>' +
        '<div class="foot"><small>Mulai dari</small><b>Rp ' + p.q.toLocaleString('id-ID') + '</b></div>' +
        '<p class="kamar">Triple ' + jt(p.t) + ' · Double ' + jt(p.d) + '</p>' +
      '</div></a>';
  }

  // Kartu pengisi agar baris tetap penuh (tidak ada kartu "yatim" di baris terakhir).
  function moreCard(bulan){
    var teks = 'Assalamualaikum, saya mau konsultasi jadwal & paket umroh' + (bulan ? ' bulan ' + bulan : '') + ' lainnya';
    return '<a class="card more" href="' + waUrl(teks) + '" target="_blank" rel="noopener">' +
      '<div class="ic">' + IC.wa + '</div>' +
      '<h3>Paket Lainnya</h3>' +
      '<p>Cari jadwal, durasi, atau tipe kamar lain? Tim kami bantu pilihkan yang paling pas.</p>' +
      '<span>Konsultasi Gratis</span></a>';
  }

  function render(b){
    var list;
    if (b === 'Semua') {
      list = PAKET.filter(function(p){ return p.unggulan; });
      if (!list.length) list = PAKET;
      list = list.slice(0, MAX);
    } else {
      list = PAKET.filter(function(p){ return p.bulan === b; });
    }
    var html = list.map(card);
    if (b === 'Semua') {
      // Genapkan ke kelipatan 3, minimal 3 dan maksimal 6 kartu.
      var target = Math.min(MAX, Math.max(MIN, Math.ceil(list.length / KOLOM) * KOLOM));
      while (html.length < target) html.push(moreCard(''));
    } else {
      // Tab bulan: paket bulan itu + 1 kartu konsultasi, rata tengah.
      html.push(moreCard(b));
    }
    grid.innerHTML = html.join('');
  }

  var bulanList = ['Semua'];
  PAKET.forEach(function(p){ if (bulanList.indexOf(p.bulan) < 0) bulanList.push(p.bulan); });
  tabs.innerHTML = bulanList.map(function(b, i){
    return '<button type="button" role="tab" class="tab' + (i ? '' : ' on') + '" data-b="' + esc(b) + '">' + esc(b) + '</button>';
  }).join('');
  tabs.addEventListener('click', function(e){
    var t = e.target.closest('.tab'); if (!t) return;
    tabs.querySelectorAll('.tab').forEach(function(x){ x.classList.toggle('on', x === t); });
    render(t.getAttribute('data-b'));
  });
  render('Semua');
})();
</script>
